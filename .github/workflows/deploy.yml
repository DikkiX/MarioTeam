name: Deploy Naar Testserver (SFTP)

env:
  # Fix voor GitHub Actions runners waar sommige JS actions anders kunnen crashen op oudere Node versies.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Voorkomt dat 2 deploys tegelijk lopen. Nieuwe push cancelt de vorige deploy-run.
  group: deploy-testserver
  cancel-in-progress: true

jobs:
  deploy:
    name: Bestanden Uploaden
    runs-on: ubuntu-latest

    steps:
      # 1) Haal de code op die we gaan checken + deployen.
      - name: Repository Ophalen
        uses: actions/checkout@v4

      # 2) Installeer PHP zodat we syntax checks kunnen draaien vóór we deployen.
      - name: PHP Installeren
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: pcov

      # 3) PHP lint: stopt de workflow als er een syntax error in een .php bestand zit.
      # Als deze stap faalt, wordt de deploy/upload stap hieronder automatisch niet uitgevoerd.
      - name: PHP Syntax Check (lint)
        run: |
          set -euo pipefail
          echo "PHP versie:"
          php -v
          echo ""
          echo "PHP lint over alle .php bestanden..."
          fail=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file"; then
              fail=1
            fi
          done < <(find . -type f -name '*.php' \
            ! -path './.git/*' \
            ! -path './.github/*' \
            ! -path './node_modules/*' \
            ! -path './vendor/*' \
            ! -path './storage/*' \
            -print0)
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "PHP lint faalde. Deploy is gestopt."
            exit 1
          fi

      # 4) Unit tests + coverage.
      # Dit voorkomt dat we kapotte logica uploaden. Coverage is een signaal: als het % laag is, missen er tests.
      - name: Composer Install (dev)
        run: |
          set -euo pipefail
          composer --version
          composer install --no-interaction --prefer-dist --no-progress

      - name: Unit Tests (PHPUnit) + Coverage
        run: |
          set -euo pipefail
          # Welke bestanden meetellen voor coverage staat in phpunit.xml (source/include).
          vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

      # 5) Deploy dependencies.
      - name: Lftp Installeren
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true install -y lftp

      # 6) Upload de repo naar de server via SFTP.
      - name: Bestanden Via SFTP Uploaden
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Deze map op de server bevat nu de site.
          DOELMAP="/customers/9/f/d/c84yb4zgy/webroots/10777826/"

          # mirror -R zet lokale bestanden naar de server.
          # --delete haalt oude repo-bestanden op de server weg.
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "sftp://$FTP_SERVER:22" <<EOF
          set sftp:auto-confirm yes
          set ssl:verify-certificate no
          mirror -R --delete --verbose \
            --exclude-glob .git \
            --exclude-glob .github \
            --exclude-glob .gitignore \
            --exclude-glob .env \
            --exclude-glob .env.* \
            --exclude-glob .DS_Store \
            --exclude-glob docs \
            --exclude-glob Oud \
            --exclude-glob node_modules \
            --exclude-glob vendor \
            --exclude-glob storage/google \
            --exclude-glob storage/google/* \
            ./ "$DOELMAP"
          bye
          EOF

      # 7) Smoke check: check of de belangrijkste pagina's/endpoints reageren na de upload.
      # We doen expres "lichte" checks (geen echte chat aanmaken, geen Gmail calls), alleen: leeft PHP + DB + routing?
      - name: Smoke Check (site + API)
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: |
          set -euo pipefail

          BASE_URL="${SITE_BASE_URL:-https://www.marioswitch1.nl}"
          BASE_URL="${BASE_URL%/}"

          echo "Smoke check base url: $BASE_URL"
          echo ""

          check_code() {
            local label="$1"
            local code="$2"
            local expected="$3"

            if [ "$code" = "$expected" ]; then
              echo "OK   $label ($code)"
              return 0
            fi

            echo "FAIL $label (got $code, expected $expected)"
            return 1
          }

          # Kleine wachttijd zodat de hosting de nieuwe files zeker "ziet".
          sleep 3

          # 1) Frontend pagina leeft
          code="$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$BASE_URL/ChatBotMrM.php")"
          check_code "ChatBotMrM.php" "$code" "200"

          # 2) API status endpoint leeft (zonder params hoort dit 422 te geven)
          code="$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$BASE_URL/api/chat/status.php")"
          check_code "api/chat/status.php (no params)" "$code" "422"

          # 3) API send endpoint leeft (POST zonder body hoort dit 400 te geven)
          code="$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 -X POST "$BASE_URL/api/chat/send.php")"
          check_code "api/chat/send.php (empty POST)" "$code" "400"
